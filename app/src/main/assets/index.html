<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money Tracker</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--card2:#eaecf3;--fg:#14151a;--mute:#6b7080;--line:#e1e3ea;--acc:#5b5bd6;--acc2:#e1e2ff;--onacc:#fff;--neg:#d64545;--pos:#1c9a5f;--shadow:0 8px 24px #0000001f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--card2:#252931;--fg:#eef0f5;--mute:#979dab;--line:#2b2f38;--acc:#aab1ff;--acc2:#353b60;--onacc:#15172b;--neg:#ff6f6f;--pos:#5ad49d;--shadow:0 8px 24px #0008}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--card2:#252931;--fg:#eef0f5;--mute:#979dab;--line:#2b2f38;--acc:#aab1ff;--acc2:#353b60;--onacc:#15172b;--neg:#ff6f6f;--pos:#5ad49d;--shadow:0 8px 24px #0008}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
#main{max-width:600px;margin:0 auto;padding:10px 16px 130px}
.ptitle{font-size:32px;font-weight:700;letter-spacing:-.6px;margin:14px 0 14px;line-height:1.15}
h2{font-size:20px;letter-spacing:-.3px}
.hello{margin:26px 0 16px}.hello small{display:block;font-size:15px;color:var(--mute)}.hello b{font-size:31px;letter-spacing:-.6px}
.card{background:var(--card);border-radius:18px;padding:14px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1;min-width:0}
.mute{color:var(--mute)}.neg{color:var(--neg)}.pos{color:var(--pos)}.small{font-size:13px}
.tx{display:flex;align-items:center;gap:14px;padding:10px 6px;border-radius:14px;cursor:pointer;transition:background .15s}
.tx:active{background:var(--card2)}
.t1{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;background:var(--card2);border-radius:6px;padding:1px 7px;color:var(--mute);margin-top:2px}
.amt{font-weight:700;font-size:16.5px;white-space:nowrap}
.ic{display:grid;place-items:center;flex:none;overflow:hidden}
.gh{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:18px 6px 4px}
.empty{text-align:center;color:var(--mute);padding:36px 0}
/* month tabs */
.mtabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:0 10px}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:none;border:0;background:none;padding:11px 14px;color:var(--mute);font-size:15px;position:relative;transition:color .2s}
.mtabs button.on{color:var(--fg);font-weight:600}
.mtabs button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--acc);animation:grow .3s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}
.pill{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:11px 14px;font-size:14.5px;margin-bottom:8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:9px;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px #0002}
.seg.big button{padding:11px;font-size:15px}
/* buttons, chips, fields */
.btn{border:0;background:var(--card2);color:var(--fg);border-radius:12px;padding:10px 14px;font-weight:500;transition:transform .12s}
.k:active{background:var(--acc2)}
.btn.pri{background:var(--acc);color:var(--onacc)}.btn.wide{width:100%;padding:16px;font-size:16.5px;border-radius:16px;font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.danger{color:var(--neg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:8px 14px;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .12s}
.chip.on{background:var(--acc2);border-color:var(--acc);font-weight:600}
.field{display:block;width:100%;padding:14px 16px;border:0;border-radius:14px;background:var(--card);margin-top:10px;outline:none}
.field:focus{box-shadow:0 0 0 2px var(--acc)}
textarea.field{min-height:96px;resize:vertical}
label{display:block;font-size:13.5px;color:var(--mute);margin:18px 2px 7px;font-weight:500}
select.sel{border:0;background:var(--card2);border-radius:10px;padding:7px 10px;font-size:14px}
/* nav + fab */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -1px 0 var(--line)}
nav button{flex:1;max-width:150px;border:0;background:none;color:var(--mute);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav .pi{position:relative;width:62px;height:32px;border-radius:16px;display:grid;place-items:center}
nav .pi::before{content:'';position:absolute;inset:0;border-radius:16px;background:var(--acc2);transform:scaleX(.3);opacity:0;transition:transform .4s cubic-bezier(.2,0,0,1),opacity .2s}
nav .pi svg{position:relative}
nav button{transition:color .25s}nav button.on{color:var(--fg);font-weight:600}nav button.on .pi::before{transform:none;opacity:1}
.fab{position:fixed;right:max(18px,calc(50% - 282px));bottom:calc(92px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:20px;background:var(--acc2);color:var(--fg);border:0;box-shadow:var(--shadow);display:grid;place-items:center;z-index:9;transition:transform .15s}

.fab.hide{transform:scale(.4);opacity:0;pointer-events:none}
.fab{transition:transform .3s cubic-bezier(.2,0,0,1),opacity .2s}
/* pages */
.page{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;}
.scrim{position:fixed;inset:0;background:#000;z-index:19;opacity:0;pointer-events:none}
.phead{position:sticky;top:0;z-index:3;background:var(--bg);margin:0 -16px;padding:0 16px;transition:box-shadow .2s}
.dhead .phead{position:static;background:none;margin:0;padding:0;box-shadow:none}
.phead.stuck{box-shadow:0 1px 0 var(--line)}
.htitle{position:absolute;left:68px;right:68px;text-align:center;font-weight:600;font-size:18px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s cubic-bezier(.2,0,0,1);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stuck .htitle{opacity:1;transform:none}
#topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:8;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .25s cubic-bezier(.2,0,0,1);pointer-events:none;box-shadow:0 1px 0 var(--line)}
#topbar.on{opacity:1;transform:none}
.ptitle{transform-origin:left center;transition:opacity .2s}
.rip{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;opacity:0}
.tx,.chip,.mtile,.acard,.tile,.k,.btn,.d,.icb{position:relative;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes pin{from{transform:translateX(60%);opacity:0}}
@keyframes pout{to{transform:translateX(60%);opacity:0}}
.pwrap{max-width:600px;margin:0 auto;padding:6px 16px 120px}
.phead{display:flex;align-items:center;gap:8px;min-height:52px}
.back{width:46px;height:46px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:inherit;transition:background .15s}
.back:active{background:var(--card2)}
.pfoot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:2}
.pfoot>div{max-width:568px;margin:0 auto}
.fade{animation:fade .28s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.anim .tx,.anim .card,.anim .acard{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
/* home */
.acards{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
.acards::-webkit-scrollbar{display:none}
.acard{flex:0 0 152px;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:14px;border:2px solid transparent;cursor:pointer}
.acard.def{border-color:var(--acc)}
.acard b{display:block;font-size:17px;margin-bottom:2px}
.worth{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.worth b{font-size:16px}
/* picker */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:8px -4px 0}
.pager::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,104px);gap:4px;padding:0 4px}
.tile{border:2px solid transparent;border-radius:18px;background:none;display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:6px;overflow:hidden;transition:transform .12s,background .15s}
.tile .ic{width:60px;height:60px;border-radius:19px}
.tile span{font-size:12px;line-height:1.25;height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center;width:100%;flex:none}
.tile.on{border-color:var(--acc);background:var(--acc2)}.tile.mv{border-style:dashed;border-color:var(--acc)}
.arr .tile{animation:wig .3s infinite alternate}@keyframes wig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}.dots i.on{background:var(--acc);width:18px;border-radius:4px}
/* amount */
.amtbox{background:var(--card);border-radius:20px;padding:14px 18px;margin:6px 0 12px;text-align:right}
.amtbig{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.15;word-break:break-all}
.amtbig.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.k{height:62px;border-radius:18px;background:var(--card);border:0;font-size:25px;transition:transform .1s,background .15s}
.k.op{background:var(--card2);color:var(--acc);font-weight:600}
.k:active{background:var(--acc2)}
/* details */
.dhead{color:#fff;padding-bottom:6px;animation:fade .3s}
.dhead .back{color:#fff}.dhead .back:active{background:#fff3}
.dicon{width:76px;height:76px;border-radius:24px;background:#ffffff2e;border:0;display:grid;place-items:center;overflow:hidden;padding:0}
.damt{background:none;border:0;color:#fff;text-align:right;padding:0}.damt div{font-size:36px;font-weight:700;letter-spacing:-.8px}.damt small{font-size:15.5px;opacity:.9}
.drow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 16px;margin-top:14px}
.drow input{border:0;background:none;font-size:16px;font-weight:600;outline:none}
.repbox{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:12px 16px;margin-top:10px;font-size:17px;font-weight:600}
.repbox input,.repbox select{border:0;background:var(--card2);border-radius:9px;padding:6px 8px;font-weight:600;font-size:16px}
.repbox input{width:56px;text-align:center}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--mute);padding:4px 0}
.d{border:1.5px solid var(--line);border-radius:12px;padding:5px 0;min-height:54px;cursor:pointer;background:var(--card);transition:transform .12s}
.d .n{font-weight:600}.d .v{font-size:10px}
.d.today{border-color:var(--acc)}.d.sel{background:var(--acc2)}
/* more */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{background:var(--card);border-radius:18px;padding:16px;text-align:left;border:0;display:flex;flex-direction:column;gap:8px;transition:transform .12s}
.mtile b{font-size:15.5px}.mtile span{font-size:12.5px;color:var(--mute)}
/* category editor */
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.icb{height:48px;border-radius:14px;border:2px solid transparent;background:var(--card);display:grid;place-items:center;padding:0}
.icb.on{border-color:var(--acc);background:var(--acc2)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;flex:none;padding:0}
.sw.on{border-color:var(--fg)}
.cropv{position:relative;width:min(82vw,300px);aspect-ratio:1;margin:14px auto;overflow:hidden;border-radius:22px;background:#000;touch-action:none;cursor:grab}
#cropImg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.cropmask{position:absolute;inset:0;border-radius:28%;box-shadow:0 0 0 999px #000a;outline:2px solid #fffa;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--acc)}
/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:60;display:none}.sheet.open{display:block}
.sbg{position:absolute;inset:0;background:#0009;animation:fadein .2s}
.sbox{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sbox h3{margin:0 0 8px;font-size:20px}.sbox p{margin:0 0 14px;color:var(--mute)}
.sheet.closing .sbox{animation:down .2s ease-in forwards}.sheet.closing .sbg{animation:fadeout .2s forwards}
@keyframes up{from{transform:translateY(100%)}}@keyframes down{to{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:70;animation:fade .25s}
</style></head><body>
<main id="main"></main>
<button class="fab" id="fab" onclick="newTx()" aria-label="Add transaction"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>
<div id="topbar"></div>
<div id="pages"></div>
<div class="sheet" id="sheet"></div>
<script src="myicons.js"></script>
<script>

// ---------- repeating items & reminders
const FQ={d:'day',w:'week',m:'month',y:'year'};
function occ(r,i){const e=r.every||1,d=new Date(r.start+'T00:00');
 if(r.freq==='d')d.setDate(d.getDate()+i*e);else if(r.freq==='w')d.setDate(d.getDate()+7*i*e);
 else{const day=d.getDate(),m=d.getMonth()+(r.freq==='m'?i*e:12*i*e),y=d.getFullYear(),last=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(day,last)))}
 return iso(d)}
function runRec(quiet){let added=0;const td=today();
 S.rec.forEach(r=>{let g=0;while(occ(r,r.n)<=td&&g++<2000){const t={id:r.id+'_'+r.n,amt:r.amt,kind:r.kind,cat:r.cat,acc:r.acc,note:r.note,date:occ(r,r.n),rec:r.id};if(r.memo)t.memo=r.memo;S.tx.push(t);r.n++;added++}});
 if(added){save();if(!quiet)renderAll()}return added}
async function stopRec(id){if(!await ask({title:'Stop this repeating item?',msg:'Entries already added will stay.',ok:'Stop',danger:true}))return;S.rec=S.rec.filter(r=>r.id!==id);save();renderAll()}
const addDays=(k,n)=>{const d=new Date(k+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
function dueRems(){const td=today(),out=[],dis=new Set(S.dis||[]);
 S.rec.forEach(r=>{if(r.remind===''||r.remind==null)return;const due=occ(r,r.n),key=r.id+'@'+due;if(addDays(due,-(+r.remind))<=td&&!dis.has(key))out.push({key,due,name:r.note||cat(r.cat).name,amt:r.amt,kind:r.kind,c:cat(r.cat)})});
 S.tx.forEach(t=>{if(t.remind==null||t.remind==='')return;const key=t.id+'@'+t.date;if(addDays(t.date,-(+t.remind))<=td&&t.date>=td&&!dis.has(key))out.push({key,due:t.date,name:t.note||cat(t.cat).name,amt:t.amt,kind:t.kind,c:cat(t.cat)})});
 return out.sort((a,b)=>a.due.localeCompare(b.due))}
function dismiss(k){S.dis=[...(S.dis||[]),k].slice(-300);save();renderMain()}
function remBanner(){const rs=dueRems(),td=today();if(!rs.length)return '';
 return `<div class="card" style="box-shadow:inset 0 0 0 1.5px var(--acc);margin-bottom:10px"><b>${nv('bell',16)} Reminders</b>${rs.map(x=>`<div class="tx" style="cursor:default">${badge(x.c,40)}<div class="sp"><div class="t1">${esc(x.name)}</div><span class="mute small">${x.due===td?'Due today':'Due '+new Date(x.due+'T00:00').toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</span></div><div class="amt ${x.kind==='inc'?'pos':'neg'}">${rm(x.amt)}</div><button class="btn sm" onclick="dismiss('${x.key}')">OK</button></div>`).join('')}</div>`}

function findIcons(img){const W=270,f=img.naturalWidth/W,H=Math.round(img.naturalHeight/f);if(H<50)return[];
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data,N=W*H,ch=[new Float32Array(N),new Float32Array(N),new Float32Array(N)];
 for(let i=0;i<N;i++){ch[0][i]=d[i*4];ch[1][i]=d[i*4+1];ch[2][i]=d[i*4+2]}
 const blur=a=>{const t=new Float32Array(N),o=new Float32Array(N);for(let y=0;y<H;y++)for(let X=0;X<W;X++){const i=y*W+X;t[i]=(a[y*W+Math.max(0,X-1)]+2*a[i]+a[y*W+Math.min(W-1,X+1)])/4}
  for(let y=0;y<H;y++)for(let X=0;X<W;X++){const i=y*W+X;o[i]=(t[Math.max(0,y-1)*W+X]+2*t[i]+t[Math.min(H-1,y+1)*W+X])/4}return o};
 const g=new Float32Array(N);
 for(const a0 of ch){const a=blur(blur(a0));for(let y=1;y<H-1;y++)for(let X=1;X<W-1;X++){const i=y*W+X,
  gx=a[i-W+1]+2*a[i+1]+a[i+W+1]-a[i-W-1]-2*a[i-1]-a[i+W-1],gy=a[i+W-1]+2*a[i+W]+a[i+W+1]-a[i-W-1]-2*a[i-W]-a[i-W+1];g[i]+=Math.hypot(gx,gy)}}
 const out=[];
 for(const thr of [150,220,320,480,700,110,85]){
  let m=new Uint8Array(N);for(let i=0;i<N;i++)m[i]=g[i]>thr?1:0;
  const morph=(m,dil)=>{const o=new Uint8Array(N);for(let y=0;y<H;y++)for(let X=0;X<W;X++){let v=dil?0:1;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=X+dx;const q=(yy<0||yy>=H||xx<0||xx>=W)?0:m[yy*W+xx];if(dil?q:!q){v=dil?1:0}}o[y*W+X]=v}return o};
  m=morph(morph(m,1),0);

  while(st.length){const i=st.pop();if(out_[i]||m[i])continue;out_[i]=1;const y=(i/W)|0,X=i%W;if(X>0)st.push(i-1);if(X<W-1)st.push(i+1);if(y>0)st.push(i-W);if(y<H-1)st.push(i+W)}
  for(let i=0;i<N;i++)m[i]=out_[i]?0:1;
  const lab=new Int32Array(N);let id=0;
  for(let s0=0;s0<N;s0++){if(!m[s0]||lab[s0])continue;id++;let x0=W,x1=0,y0=H,y1=0,cnt=0;const q=[s0];lab[s0]=id;
   while(q.length){const i=q.pop(),y=(i/W)|0,X=i%W;cnt++;if(X<x0)x0=X;if(X>x1)x1=X;if(y<y0)y0=y;if(y>y1)y1=y;
    for(const j of [X>0?i-1:-1,X<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1])if(j>=0&&m[j]&&!lab[j]){lab[j]=id;q.push(j)}}
   const w=x1-x0+1,h=y1-y0+1;if(!(w>.1*W&&w<.3*W&&w/h>.85&&w/h<1.18)||y0<.05*H||cnt/(w*h)<.7)continue;
   const s=Math.max(w,h),cx=(x0+x1+1)/2,cy=(y0+y1+1)/2,b={x:Math.round((cx-s/2)*f),y:Math.round((cy-s/2)*f),s:Math.round(s*f)};
   if(out.some(o=>Math.abs(b.x+b.s/2-o.x-o.s/2)<o.s/2&&Math.abs(b.y+b.s/2-o.y-o.s/2)<o.s/2))continue;out.push(b)}}
 out.sort((a,b)=>a.y-b.y);const rows=[];out.forEach(b=>{const r=rows.at(-1);if(r&&Math.abs(b.y-r[0].y)<b.s*.4)r.push(b);else rows.push([b])});
 return rows.flatMap(r=>r.sort((a,b)=>a.x-b.x))}

function useCrop(){if(!CR||!CR.img)return;const V=$('cropv').clientWidth,s=CR.base*CR.z,N=192,sx=-CR.x/s,sy=-CR.y/s,sw=V/s;

PAGES.backup=()=>head()+`<h1 class="ptitle">Backup &amp; restore</h1>
 <p class="mute">Your data is stored only on this device. Save a backup regularly, especially before reinstalling the app.</p>
 <button class="btn pri wide" onclick="saveBackup()">Save backup file</button>
 <label>Or copy your backup as text</label><button class="btn wide" onclick="copyBackup()">Copy backup text</button>
 <h2 style="margin-top:30px">Restore</h2><p class="mute">Restoring replaces everything currently in the app.</p>
 <button class="btn wide" onclick="$('rsFile').click()">Choose backup file…</button><input type="file" id="rsFile" accept=".json,application/json,text/plain" hidden onchange="restoreFile(this)">
 <textarea class="field" id="rsText" placeholder="…or paste backup text here"></textarea>
 <button class="btn wide" style="margin-top:10px" onclick="restoreText($('rsText').value)">Restore from text</button>`;
function bname(){return 'money-tracker-backup-'+today()+'.json'}
function saveBackup(){const data=JSON.stringify(S);
 if(window.AndroidBridge&&AndroidBridge.saveText){toast(AndroidBridge.saveText(bname(),data));return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=bname();document.body.appendChild(a);a.click();a.remove();toast('Backup file saved')}catch(e){copyBackup()}}
function copyBackup(){const t=document.createElement('textarea');t.value=JSON.stringify(S);document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();
 if(ok)toast('Copied – paste it somewhere safe');else if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>toast('Copy failed'))}
function restoreFile(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;f.text().then(restoreText)}
async function restoreText(s){let d;try{d=JSON.parse(s)}catch(e){return toast('That is not a valid backup')}
 if(!d||!Array.isArray(d.cats)||!Array.isArray(d.tx))return toast('That is not a valid backup');
 if(!await ask({title:'Restore this backup?',msg:`It has ${d.tx.length} transactions. Everything currently in the app will be replaced.`,ok:'Restore',danger:true}))return;
 S=d;normalise();runRec(true);save();closeAll();toast('Backup restored');renderMain(true)}

// ---- charts
const hidden=()=>new Set(S.hide||[]);
function togCat(id){const h=hidden();h.has(id)?h.delete(id):h.add(id);S.hide=[...h];save();render()}
function setAll(on,ids){S.hide=on?(S.hide||[]).filter(x=>!ids.includes(x)):[...new Set([...(S.hide||[]),...ids])];save();render()}
function spendBy(list){const m={};list.filter(t=>t.kind==='exp').forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return m}
function charts(){
 const h=hidden(),by=spendBy(monthTx());
 // last 12 months ending at viewed month
 const months=[];for(let i=11;i>=0;i--){const d=new Date(mon.getFullYear(),mon.getMonth()-i,1);const k=iso(d).slice(0,7);months.push({k,lab:d.toLocaleString('en',{month:'short'}),by:spendBy(S.tx.filter(t=>t.date.startsWith(k)))})}
 const used=[...new Set([...Object.keys(by),...months.flatMap(m=>Object.keys(m.by))])];
 const ids=used.map(cat).sort((a,b)=>(by[b.id]||0)-(by[a.id]||0)).map(c=>c.id).filter(Boolean);
 const PAL=['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#2f4b7c','#a0cbe8','#8cd17d','#d37295','#86bcb6','#f1ce63','#bab0ac'];const col=id=>PAL[ids.indexOf(id)%PAL.length];
 if(!used.length)return `<h2 style="margin-top:28px">Spending</h2><div class="empty">No spending in the last 12 months yet.</div>`;
 // pie
 const sl=Object.entries(by).filter(([id])=>!h.has(id)).sort((a,b)=>b[1]-a[1]),tot=sl.reduce((a,x)=>a+x[1],0);
 let pie='',a0=-Math.PI/2;const R=80,r=48,C=100;
 const pt=(a,rad)=>`${C+rad*Math.cos(a)} ${C+rad*Math.sin(a)}`;
 sl.forEach(([id,v])=>{const c=cat(id),a1=a0+v/tot*2*Math.PI;
  if(sl.length===1)pie+=`<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${col(id)}" stroke-width="${R-r}"/>`;
  else{const L=a1-a0>Math.PI?1:0;pie+=`<path d="M${pt(a0,R)}A${R} ${R} 0 ${L} 1 ${pt(a1,R)}L${pt(a1,r)}A${r} ${r} 0 ${L} 0 ${pt(a0,r)}Z" fill="${col(id)}" stroke="var(--card)" stroke-width="1.5"><title>${esc(c.name)}: ${rm(v)}</title></path>`}
  a0=a1});
 const pieSvg=tot?`<svg viewBox="0 0 200 200" style="width:200px;max-width:100%;display:block;margin:0 auto">${pie}<text x="100" y="96" text-anchor="middle" font-size="11" fill="var(--mute)">Spent</text><text x="100" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">${rm(tot)}</text></svg>`:'<div class="empty">No spending for the selected categories this month.</div>';
 const legend=ids.map(id=>{const c=cat(id),v=by[id]||0,off=h.has(id);
  return `<button class="tx" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);font:inherit;text-align:left;opacity:${off?.4:1}" onclick="togCat('${id}')">
  <span style="width:18px;height:18px;border-radius:5px;flex:none;display:grid;place-items:center;color:#fff;font-size:12px;background:${off?'var(--line)':col(id)}">${off?'':'✓'}</span>
  <span style="display:flex">${ico(c.icon,c.col)}</span><span class="sp">${esc(c.name)}</span><span class="mute" style="font-size:12px">${!off&&tot&&v?Math.round(v/tot*100)+'%':''}</span><span class="amt">${v?rm(v):'–'}</span></button>`}).join('');
 // stacked bars
 const W=340,H=180,top=18,bw=W/12,mx=Math.max(1,...months.map(m=>Object.entries(m.by).filter(([id])=>!h.has(id)).reduce((a,x)=>a+x[1],0)));
 const fmt=v=>v>=1000?(v/1000).toFixed(1)+'k':Math.round(v);
 let bars='';months.forEach((m,i)=>{let y=top+H;const x=i*bw+bw*.18,w=bw*.64;let t=0;
  ids.filter(id=>!h.has(id)&&m.by[id]).forEach(id=>{const v=m.by[id],hh=v/mx*H;y-=hh;t+=v;bars+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(hh,0)}" fill="${col(id)}"><title>${m.lab} · ${esc(cat(id).name)}: ${rm(v)}</title></rect>`});
  if(t)bars+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--fg)">${fmt(t)}</text>`;
  bars+=`<text x="${x+w/2}" y="${top+H+14}" text-anchor="middle" font-size="9" fill="${m.k===ym()?'var(--acc)':'var(--mute)'}" font-weight="${m.k===ym()?700:400}">${m.lab}</text>`});
 return `<h2 style="margin:28px 0 4px">Spending by category</h2><p class="mute" style="margin:0 0 10px">${mon.toLocaleString('en',{month:'long',year:'numeric'})} · tap a category to show or hide it</p>
 <div class="card">${pieSvg}
 <div class="row" style="margin:10px 0 2px"><span class="sp"></span><button class="btn sm" onclick="setAll(true,${esc(JSON.stringify(ids))})">Select all</button><button class="btn sm" onclick="setAll(false,${esc(JSON.stringify(ids))})">Clear all</button></div>${legend}</div>
 <h2 style="margin:28px 0 4px">Monthly spending</h2><p class="mute" style="margin:0 0 10px">Last 12 months, coloured by category (same filter as above)</p>
 <div class="card"><svg viewBox="0 0 ${W} ${top+H+20}" style="width:100%;display:block"><line x1="0" x2="${W}" y1="${top+H}" y2="${top+H}" stroke="var(--line)"/>${bars}</svg></div>`}

// ---------- start
runRec(true);S.accs.forEach(ainfo);save();renderMain(true);countUp($('main'));
setInterval(()=>{runRec();if(!stack.length&&!sheetClose)renderMain()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){runRec();renderMain()}});
</script></body></html>
